name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a compilar y publicar (p. ej. v0.3.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Verify tag matches pubspec.yaml version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ "${TAG#v}" != "$PUBSPEC_VERSION" ]; then
            echo "Tag $TAG does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            asset: windows-x64
          - os: ubuntu-latest
            target: linux
            asset: linux-x64
          - os: macos-latest
            target: macos
            asset: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # Se distribuye fuera de la App Store: el sandbox impediría abrir archivos fuera del contenedor y ejecutar herramientas externas.
      - name: Disable macOS app sandbox
        if: matrix.target == 'macos'
        run: |
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$f"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - name: Package
        shell: bash
        run: |
          VERSION="${TAG#v}"
          ZIP="ZeeTools-$VERSION-${{ matrix.asset }}.zip"
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows)
              (cd build/windows/x64/runner/Release && 7z a -r "$GITHUB_WORKSPACE/dist/$ZIP" .) ;;
            linux)
              (cd build/linux/x64/release/bundle && zip -r "$GITHUB_WORKSPACE/dist/$ZIP" .) ;;
            macos)
              (cd build/macos/Build/Products/Release && ditto -c -k --keepParent ZeeTools.app "$GITHUB_WORKSPACE/dist/$ZIP") ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeetools-${{ matrix.asset }}
          path: dist/*
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Las líneas del tag que no son viñetas pasan a ser títulos de sección.
      - name: Write release notes
        run: |
          VERSION="${TAG#v}"
          git tag -l --format='%(contents:body)' "$TAG" | awk 'NF == 0 { next } /^- / { print; next } { print (NR > 1 ? "\n" : "") "## " $0 "\n" }' > notes.md
          cat >> notes.md <<EOF

          ## Instalación

          - **Windows x64:** descomprime \`ZeeTools-$VERSION-windows-x64.zip\` y ejecuta \`zeetools.exe\`. La primera vez que se optimizan imágenes se descargan sus herramientas (~110 MB).
          - **Linux x64:** descomprime \`ZeeTools-$VERSION-linux-x64.zip\` y ejecuta \`./zeetools\`. Necesita GTK 3 y \`zenity\` para el selector de archivos.
          - **macOS:** descomprime \`ZeeTools-$VERSION-macos.zip\` y abre \`ZeeTools.app\`. No está firmada: la primera vez ábrela con clic derecho → Abrir, o ejecuta \`xattr -dr com.apple.quarantine ZeeTools.app\`.

          En Linux y macOS el optimizador de imágenes usa las herramientas instaladas en el sistema (libjxl, libwebp, libavif, oxipng y mozjpeg) que encuentre en el \`PATH\`.
          EOF

      # Se crea como borrador para subir los archivos antes de publicarla; si ya existe solo los reemplaza, para no perder sus notas.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "ZeeTools ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
