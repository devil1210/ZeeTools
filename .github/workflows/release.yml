name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a compilar y publicar (p. ej. v0.4.8.1)'
        required: false
        default: 'v0.4.8.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release --build-name=0.4.8 --build-number=1

      - name: Package Windows
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "master" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v0.4.8.1"
          fi
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          # Paquete completo en ZIP con todas las librerias y assets
          (cd build/windows/x64/runner/Release && 7z a -r "$GITHUB_WORKSPACE/dist/ZeeTools-$VERSION-windows-x64.zip" .)
          # Ejecutable directo
          cp build/windows/x64/runner/Release/zeetools.exe dist/zeetools.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeetools-windows-x64
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "master" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v0.4.8.1"
          fi
          VERSION="${TAG_NAME#v}"
          echo "Creating or updating release for $TAG_NAME"
          gh release create "$TAG_NAME" dist/* --title "ZeeTools $TAG_NAME (v0.4.8.1 con Consola Editorial)" --notes "### Novedades en $TAG_NAME:
- ✨ Actualizado y sincronizado con **ZeeTools v0.4.8**
- ✨ Consola Editorial ZeePub adaptada a las nuevas APIs (AmazonLookup y EditableList)
- ✨ Metadatos, tomos, series y asistencia de IA Gemini
- ✨ Publicación instantánea y programada a Telegram

### Descarga para Windows x64:
- **Recomendado (Completo):** Descarga \`ZeeTools-$VERSION-windows-x64.zip\`, descomprímelo y ejecuta \`zeetools.exe\`.
- **Ejecutable directo:** Si ya tienes una instalación previa de ZeeTools, puedes descargar \`zeetools.exe\` directamente y reemplazarlo en tu carpeta." || gh release upload "$TAG_NAME" dist/* --clobber
        shell: bash
