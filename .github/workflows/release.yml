name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a compilar y publicar (p. ej. v0.5.0)'
        required: false
        default: 'v0.5.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p dist
          (cd build/windows/x64/runner/Release && 7z a -r "$GITHUB_WORKSPACE/dist/ZeeTools-v0.5.0-windows-x64.zip" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeetools-windows-x64
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "master" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v0.5.0"
          fi
          echo "Creating or updating release for $TAG_NAME"
          gh release create "$TAG_NAME" dist/* --title "ZeeTools $TAG_NAME (Consola Editorial ZeePub)" --notes "### Novedades en $TAG_NAME:\n- ✨ Nueva **Consola Editorial ZeePub** integrada\n- ✨ Sugerencias inteligentes de metadatos con Gemini IA\n- ✨ Publicación instantánea y programada a Telegram\n- ✨ Selector rápido de Fansubs y Filtros por Color/Sin Censura\n\nDescomprime \`ZeeTools-v0.5.0-windows-x64.zip\` y ejecuta \`zeetools.exe\`." || gh release upload "$TAG_NAME" dist/* --clobber
        shell: bash
